<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BLE接続テスト</title>
</head>

<body>

    <h1>ソーラーコントローラー BLEテスト</h1>

    <button id="connectButton">
        Bluetooth接続
    </button>

    <pre id="log"></pre>

    <script>

        // ========================================
        // BLEのUUID
        // ========================================

        const NUS_SERVICE =
            "6e400001-b5a3-f393-e0a9-e50e24dcca9e";


        const RX_UUID =
            "6e400002-b5a3-f393-e0a9-e50e24dcca9e";


        const TX_UUID =
            "6e400003-b5a3-f393-e0a9-e50e24dcca9e";


        // ========================================
        // ログ表示
        // ========================================

        function log(message) {

            console.log(message);

            document.getElementById("log").textContent +=
                message + "\n";
        }


        // ========================================
        // Bluetooth接続
        // ========================================

        async function connectBLE() {

            try {

                log("① Bluetoothデバイスを探しています...");


                // Bluetooth機器を選択
                const device =
                    await navigator.bluetooth.requestDevice({

                        acceptAllDevices: true,

                        optionalServices: [
                            NUS_SERVICE
                        ]

                    });


                log(
                    "② デバイス発見: " +
                    device.name
                );


                log(
                    "③ デバイスID: " +
                    device.id
                );


                // 切断されたとき
                device.addEventListener(
                    "gattserverdisconnected",
                    function() {

                        log("Bluetoothが切断されました");

                    }
                );


                log("④ GATT接続開始...");


                // GATTへ接続
                const server =
                    await device.gatt.connect();


                log("⑤ GATT接続成功！");


                // NUSサービス取得
                const service =
                    await server.getPrimaryService(
                        NUS_SERVICE
                    );


                log("⑥ Nordic UART Service取得成功！");


                // RX取得
                const rx =
                    await service.getCharacteristic(
                        RX_UUID
                    );


                log("⑦ RX Characteristic取得成功！");


                // TX取得
                const tx =
                    await service.getCharacteristic(
                        TX_UUID
                    );


                log("⑧ TX Characteristic取得成功！");


                log("");
                log("========================");
                log("接続テスト成功！");
                log("========================");


            } catch (error) {

                log("");
                log("========================");
                log("エラー発生");
                log("========================");

                log(
                    error.name
                );

                log(
                    error.message
                );

                console.error(error);

            }

        }


        // ========================================
        // ボタン
        // ========================================

        document
            .getElementById("connectButton")
            .addEventListener(
                "click",
                connectBLE
            );

    </script>

</body>
</html>
