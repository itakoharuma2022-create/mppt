<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE Solar Monitor</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        h1 {
            text-align: center;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #2196f3;
            color: white;
            margin-bottom: 15px;
        }
        button:active {
            background: #1976d2;
        }
        #log {
            background: #111;
            color: #00ff00;
            padding: 15px;
            border-radius: 8px;
            min-height: 300px;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: monospace;
            font-size: 14px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>BLE Solar Monitor</h1>
    <button id="connectButton">Bluetooth接続</button>
    <div id="log"></div>
</div>

<script>
    // UUID定義
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    const connectButton = document.getElementById("connectButton");
    const logElement = document.getElementById("log");

    function log(message) {
        console.log(message);
        logElement.textContent += message + "\n";
        logElement.scrollTop = logElement.scrollHeight;
    }

    // 指定時間(ミリ秒)待つ関数
    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    // リトライ付きGATT接続関数
    async function connectGattWithRetry(device, maxRetries = 3) {
        for (let i = 1; i <= maxRetries; i++) {
            try {
                log(`④ GATT接続開始 (${i}/${maxRetries}回目)...`);
                // デバイス選択後や失敗後の通信安定化のために1秒待つ
                await sleep(1000);
                const server = await device.gatt.connect();
                return server;
            } catch (err) {
                log(`⚠️ 接続失敗 (${i}回目): ${err.message}`);
                if (i === maxRetries) throw err; // 規定回数失敗したらエラーを投げる
                log("1秒後に再試行します...");
            }
        }
    }

    connectButton.addEventListener("click", async function() {
        try {
            logElement.textContent = "";
            log("① Bluetoothデバイスを探しています...");

            const device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [SERVICE_UUID]
            });

            log("② デバイス発見: " + device.name);
            log("③ デバイスID: " + device.id);

            // リトライ付きでGATT接続
            const server = await connectGattWithRetry(device, 3);
            log("⑤ GATT接続成功！");

            log("⑥ Nordic UART Service取得中...");
            const service = await server.getPrimaryService(SERVICE_UUID);
            log("   Service取得成功！");

            log("⑦ RX Characteristic取得中...");
            const rx = await service.getCharacteristic(RX_UUID);
            log("   RX Characteristic取得成功！");

            log("⑧ TX Characteristic取得中...");
            const tx = await service.getCharacteristic(TX_UUID);
            log("   TX Characteristic取得成功！");

            log("🎉 すべての準備が完了しました！");

        } catch (error) {
            log("\n❌ エラー: " + error.name + " - " + error.message);
        }
    });
</script>
</body>
</html>
