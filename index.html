<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPPT 接続診断 (CRC自動計算版)</title>
  <style>
    body { font-family: sans-serif; padding: 16px; background: #f0f2f5; margin: 0; text-align: center; }
    h1 { font-size: 1.3em; color: #333; }
    .card { background: white; padding: 16px; border-radius: 12px; margin: 12px auto; max-width: 360px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: left; }
    button { padding: 12px; font-size: 1em; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 8px; width: 100%; box-sizing: border-box; }
    .btn-connect { background: #007bff; color: white; }
    .btn-send { background: #28a745; color: white; }
    button:disabled { background: #ccc; color: #666; cursor: not-allowed; }
    .hex-box { font-family: monospace; font-size: 0.9em; background: #e9ecef; padding: 10px; border-radius: 6px; min-height: 40px; word-break: break-all; }
    .val-box { font-size: 1.5em; font-weight: bold; color: #d9534f; text-align: center; margin-top: 10px; }
    .log-box { font-family: monospace; font-size: 0.75em; color: #0f0; background: #222; padding: 10px; border-radius: 6px; height: 200px; overflow-y: auto; white-space: pre-wrap; }
    .flex-btns { display: flex; gap: 8px; }
  </style>
</head>
<body>

  <h1>MPPT 接続診断 (CRC版)</h1>

  <div class="card">
    <button id="connectBtn" class="btn-connect">1. デバイスに接続</button>
    <div style="font-size: 0.85em; text-align: center; margin-top: 5px;" id="status">待機中...</div>
  </div>

  <div class="card">
    <div style="font-size: 0.85em; font-weight: bold; margin-bottom: 8px;">2. コマンド送信テスト</div>
    <div class="flex-btns">
      <button id="btnCmd1" class="btn-send" disabled>パターンA</button>
      <button id="btnCmd2" class="btn-send" disabled>パターンB</button>
      <button id="btnCmd3" class="btn-send" disabled>パターンC</button>
    </div>
  </div>

  <div class="card">
    <div style="font-size: 0.85em; font-weight: bold; margin-bottom: 8px;">受信データ (HEX)</div>
    <div id="hexValue" class="hex-box">--</div>
    <div style="font-size: 0.85em; font-weight: bold; margin-top: 12px;">解析電圧</div>
    <div id="parsedValue" class="val-box">-- V</div>
  </div>

  <div class="card">
    <div style="font-size: 0.85em; font-weight: bold; margin-bottom: 8px;">システムログ</div>
    <div id="logBox" class="log-box"></div>
  </div>

  <script>
    const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    let targetWriteChar = null;

    // Modbusのパスワード(CRC16)を自動計算して正しい順序で付与する関数
    function appendCRC(dataArray) {
      let crc = 0xFFFF;
      for (let i = 0; i < dataArray.length; i++) {
        crc ^= dataArray[i];
        for (let j = 0; j < 8; j++) {
          if ((crc & 1) !== 0) {
            crc = (crc >> 1) ^ 0xA001;
          } else {
            crc = crc >> 1;
          }
        }
      }
      // Modbusルールに従い、下位バイト→上位バイトの順でくっつける
      return new Uint8Array([...dataArray, crc & 0xFF, (crc >> 8) & 0xFF]);
    }

    // 基本コマンド (パスワード計算前)
    const baseCmds = {
      cmd1: [0x01, 0x03, 0x01, 0x00, 0x00, 0x0A], // パターンA
      cmd2: [0x01, 0x03, 0x31, 0x00, 0x00, 0x0A], // パターンB
      cmd3: [0x01, 0x03, 0x00, 0x00, 0x00, 0x14]  // パターンC
    };

    function log(msg) {
      const box = document.getElementById('logBox');
      box.innerText += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
      box.scrollTop = box.scrollHeight;
    }

    document.getElementById('connectBtn').addEventListener('click', async () => {
      try {
        log('スキャン開始...');
        document.getElementById('status').innerText = '検索中...';
        
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        log(`デバイス: ${device.name}`);
        document.getElementById('status').innerText = '接続中...';
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        
        const characteristics = await service.getCharacteristics();
        for (const char of characteristics) {
          if (char.properties.notify || char.properties.indicate) {
            char.addEventListener('characteristicvaluechanged', handleData);
            await char.startNotifications();
            log(`[RX] 受信設定完了`);
          }
          if (char.properties.write || char.properties.writeWithoutResponse) {
            targetWriteChar = char;
            log(`[TX] 送信準備完了`);
          }
        }

        if (targetWriteChar) {
          document.getElementById('status').innerText = 'ボタンで送信してください';
          document.getElementById('btnCmd1').disabled = false;
          document.getElementById('btnCmd2').disabled = false;
          document.getElementById('btnCmd3').disabled = false;
        }

      } catch (error) {
        log(`エラー: ${error.message}`);
        document.getElementById('status').innerText = 'エラー';
      }
    });

    async function sendCommand(cmdName, baseData) {
      if (!targetWriteChar) return;
      try {
        const fullCmd = appendCRC(baseData); // ここでパスワードをくっつける
        const hexStr = Array.from(fullCmd).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
        log(`送信: ${cmdName} (${hexStr})`);
        
        if (targetWriteChar.properties.writeWithoutResponse) {
          await targetWriteChar.writeValueWithoutResponse(fullCmd);
        } else {
          await targetWriteChar.writeValue(fullCmd);
        }
      } catch (error) {
        log(`送信失敗: ${error.message}`);
      }
    }

    document.getElementById('btnCmd1').addEventListener('click', () => sendCommand('パターンA', baseCmds.cmd1));
    document.getElementById('btnCmd2').addEventListener('click', () => sendCommand('パターンB', baseCmds.cmd2));
    document.getElementById('btnCmd3').addEventListener('click', () => sendCommand('パターンC', baseCmds.cmd3));

    function handleData(event) {
      const bytes = new Uint8Array(event.target.value.buffer);
      const hexString = Array.from(bytes).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
      document.getElementById('hexValue').innerText = hexString;
      log(`★受信: ${hexString}`);

      if (bytes.length >= 7) {
        let rawVal = (bytes[3] << 8) | bytes[4]; 
        for(let i = 3; i < bytes.length - 1; i+=2) {
            let tempVal = (bytes[i] << 8) | bytes[i+1];
            if(tempVal >= 70 && tempVal <= 300) {
                rawVal = tempVal;
                break;
            }
        }
        document.getElementById('parsedValue').innerText = (rawVal / 10).toFixed(1) + ' V';
      }
    }
  </script>
</body>
</html>
