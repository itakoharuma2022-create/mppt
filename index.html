<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <!-- スマホ表示用 -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BLE 充放電コントローラーモニター</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #101418;
            color: #ffffff;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9da7b3;
            margin-bottom: 20px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 14px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        #connectButton {
            background: #1976d2;
            color: white;
        }

        #disconnectButton {
            background: #444;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .connection {
            background: #1a2027;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        .status {
            font-size: 18px;
            font-weight: bold;
        }

        .online {
            color: #4caf50;
        }

        .offline {
            color: #f44336;
        }

        .grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .card {
            background: #1a2027;
            border-radius: 12px;
            padding: 18px;
        }

        .card-title {
            color: #9da7b3;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .value {
            font-size: 27px;
            font-weight: bold;
        }

        .unit {
            font-size: 14px;
            color: #9da7b3;
            margin-left: 4px;
        }

        .section {
            margin-top: 25px;
        }

        .section h2 {
            font-size: 19px;
        }

        .log {
            background: #080a0c;
            border-radius: 10px;
            padding: 12px;
            height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            color: #d0d7de;
        }

        .packet {
            background: #080a0c;
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
        }

        .state-on {
            color: #4caf50;
            font-weight: bold;
        }

        .state-off {
            color: #f44336;
            font-weight: bold;
        }

        .warning {
            background: #332800;
            color: #ffd54f;
            border-radius: 10px;
            padding: 12px;
            margin-top: 15px;
        }

        @media (max-width: 500px) {
            body {
                padding: 12px;
            }

            h1 {
                font-size: 21px;
            }

            .value {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔋 BLE 充放電コントローラーモニター</h1>

    <div class="subtitle">
        Nordic UART Service / Web Bluetooth
    </div>


    <!-- 接続 -->
    <div class="connection">

        <div id="connectionStatus"
             class="status offline">
            ● 未接続
        </div>

        <div id="deviceName">
            デバイス: -
        </div>

        <br>

        <button id="connectButton">
            🔵 Bluetooth接続
        </button>

        <button id="disconnectButton" disabled>
            🔴 切断
        </button>

    </div>


    <!-- 注意 -->
    <div class="warning">
        ⚠️ Web Bluetooth対応ブラウザが必要です。
        HTTPS環境（GitHub Pagesなど）で使用してください。
    </div>


    <!-- 測定値 -->
    <div class="section">

        <h2>📊 リアルタイムデータ</h2>

        <div class="grid">

            <div class="card">

                <div class="card-title">
                    バッテリー電圧
                </div>

                <div class="value">
                    <span id="batteryVoltage">
                        -
                    </span>

                    <span class="unit">
                        V
                    </span>
                </div>

            </div>


            <div class="card">

                <div class="ca
