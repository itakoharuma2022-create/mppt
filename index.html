<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <!-- スマホでも見やすくする -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BLE Solar Monitor</title>

    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #2196f3;
            color: white;
            margin-bottom: 15px;
        }

        button:active {
            background: #1976d2;
        }

        #log {
            background: #111;
            color: #00ff00;
            padding: 15px;
            border-radius: 8px;
            min-height: 300px;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: monospace;
            font-size: 14px;
            overflow-y: auto;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>BLE Solar Monitor</h1>

    <button id="connectButton">
        Bluetooth接続
    </button>

    <div id="log"></div>

</div>


<script>

    // ========================================
    // BLE UUID
    // ========================================

    const SERVICE_UUID =
        "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

    // RX = コントローラー → スマホ
    const RX_UUID =
        "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    // TX = スマホ → コントローラー
    const TX_UUID =
        "6e400003-b5a3-f393-e0a9-e50e24dcca9e";


    // ========================================
    // HTML elements
    // ========================================

    const connectButton =
        document.getElementById("connectButton");

    const logElement =
        document.getElementById("log");


    // ========================================
    // ログ表示
    // ========================================

    function log(message) {

        console.log(message);

        logElement.textContent +=
            message + "\n";

        // 一番下までスクロール
        logElement.scrollTop =
            logElement.scrollHeight;
    }


    // ========================================
    // Bluetooth接続
    // ========================================

    connectButton.addEventListener(
        "click",
        async function() {

            try {

                // ログをクリア
                logElement.textContent = "";

                log("① Bluetoothデバイスを探しています...");


                // ========================================
                // デバイス検索
                // ========================================

                const device =
                    await navigator.bluetooth.requestDevice({

                        acceptAllDevices: true,

                        optionalServices: [
                            SERVICE_UUID
                        ]

                    });


                log(
                    "② デバイス発見: "
                    + device.name
                );


                log(
                    "③ デバイスID: "
                    + device.id
                );


                // ========================================
                // GATT接続
                // ========================================

                log("④ GATT接続開始...");

                const server =
                    await device.gatt.connect();


                log("⑤ GATT接続成功！");


                // ========================================
                // Nordic UART Service
                // ========================================

                const service =
                    await server.getPrimaryService(
                        SERVICE_UUID
                    );


                log(
                    "⑥ Nordic UART Service取得成功！"
                );


                // ========================================
                // RX Characteristic
                // ========================================

                const rx =
                    await service.getCharacteristic(
                        RX_UUID
                    );


                log(
                    "⑦ RX Characteristic取得成功！"
                );


                // ========================================
                // TX Characteristic
                // ========================================

                const tx =
                    await service.getCharacteristic(
                        TX_UUID
                    );


                log(
                    "⑧ TX Characteristic取得成功！"
                );


                // ========================================
                // STEP 2
                // Notification開始
                // ========================================

                await rx.startNotifications();


                log(
                    "⑨ Notification開始成功！"
                );


                // ========================================
                // データ受信イベント
                // ========================================

                rx.addEventListener(
                    "characteristicvaluechanged",
                    function(event) {

                        const value =
                            event.target.value;


                        // DataView → Uint8Array
                        const bytes =
                            new Uint8Array(
                                value.buffer,
                                value.byteOffset,
                                value.byteLength
                            );


                        // ========================================
                        // HEXへ変換
                        // ========================================

                        const hex =
                            [...bytes]
                            .map(
                                function(byte) {

                                    return byte
                                        .toString(16)
                                        .padStart(2, "0");

                                }
                            )
                            .join(" ");


                        // ========================================
                        // 受信データ表示
                        // ========================================

                        log(
                            "受信データ: "
                            + hex
                        );

                    }
                );


                log(
                    "⑩ データ受信待機中..."
                );


                // ========================================
                // 接続テスト成功
                // ========================================

                log("");
                log(
                    "========================"
                );
                log(
                    "接続テスト成功！"
                );
                log(
                    "========================"
                );


                // ========================================
                // 切断時
                // ========================================

                device.addEventListener(
                    "gattserverdisconnected",
                    function() {

                        log("");
                        log(
                            "Bluetooth切断"
                        );

                    }
                );


            } catch (error) {

                log("");

                log(
                    "エラー: "
                    + error.message
                );

                console.error(error);

            }

        }
    );

</script>

</body>
</html>
