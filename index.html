<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPPT 接続診断ツール</title>
  <style>
    body { font-family: sans-serif; padding: 16px; background: #f0f2f5; margin: 0; text-align: center; }
    h1 { font-size: 1.3em; color: #333; }
    .card { background: white; padding: 16px; border-radius: 12px; margin: 12px auto; max-width: 360px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: left; }
    button { padding: 12px; font-size: 1em; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 8px; width: 100%; box-sizing: border-box; }
    .btn-connect { background: #007bff; color: white; }
    .btn-send { background: #28a745; color: white; }
    button:disabled { background: #ccc; color: #666; cursor: not-allowed; }
    .hex-box { font-family: monospace; font-size: 0.9em; background: #e9ecef; padding: 10px; border-radius: 6px; min-height: 40px; word-break: break-all; }
    .log-box { font-family: monospace; font-size: 0.75em; color: #444; background: #222; color: #0f0; padding: 10px; border-radius: 6px; height: 200px; overflow-y: auto; white-space: pre-wrap; }
    .flex-btns { display: flex; gap: 8px; }
  </style>
</head>
<body>

  <h1>MPPT 接続診断ツール</h1>

  <div class="card">
    <button id="connectBtn" class="btn-connect">1. デバイスに接続</button>
    <div style="font-size: 0.85em; text-align: center; margin-top: 5px;" id="status">待機中...</div>
  </div>

  <div class="card">
    <div style="font-size: 0.85em; font-weight: bold; margin-bottom: 8px;">2. コマンド手動送信</div>
    <div class="flex-btns">
      <button id="btnCmd1" class="btn-send" disabled>標準 (01)</button>
      <button id="btnCmd2" class="btn-send" disabled>全体 (FF)</button>
      <button id="btnCmd3" class="btn-send" disabled>ゼロ (00)</button>
    </div>
  </div>

  <div class="card">
    <div style="font-size: 0.85em; font-weight: bold; margin-bottom: 8px;">最新の受信データ (HEX)</div>
    <div id="hexValue" class="hex-box">--</div>
  </div>

  <div class="card">
    <div style="font-size: 0.85em; font-weight: bold; margin-bottom: 8px;">システムログ</div>
    <div id="logBox" class="log-box"></div>
  </div>

  <script>
    const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    let targetWriteChar = null;

    const cmds = {
      cmd1: new Uint8Array([0x01, 0x03, 0x00, 0x00, 0x00, 0x0A, 0xC5, 0xCD]),
      cmd2: new Uint8Array([0xFF, 0x03, 0x00, 0x00, 0x00, 0x0A, 0xC0, 0x14]),
      cmd3: new Uint8Array([0x00, 0x03, 0x00, 0x00, 0x00, 0x0A, 0xC5, 0x1A])
    };

    function log(msg) {
      const box = document.getElementById('logBox');
      box.innerText += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
      box.scrollTop = box.scrollHeight;
    }

    document.getElementById('connectBtn').addEventListener('click', async () => {
      try {
        log('スキャン開始...');
        document.getElementById('status').innerText = '検索中...';
        
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        log(`デバイス選択: ${device.name}`);
        document.getElementById('status').innerText = '接続中...';
        const server = await device.gatt.connect();
        log('GATT接続成功');

        const service = await server.getPrimaryService(SERVICE_UUID);
        log('サービス取得成功。特性を自動探索します...');

        // 全ての特性(Characteristics)を取得して自動判別
        const characteristics = await service.getCharacteristics();
        
        for (const char of characteristics) {
          log(`発見: ${char.uuid.substring(4,8)}...`);
          
          // 通知(Notify)が可能なドアなら受信設定する
          if (char.properties.notify || char.properties.indicate) {
            char.addEventListener('characteristicvaluechanged', handleData);
            await char.startNotifications();
            log(` └ 受信(Notify)設定完了！`);
          }
          
          // 書き込み(Write)が可能なドアなら送信設定する
          if (char.properties.write || char.properties.writeWithoutResponse) {
            targetWriteChar = char;
            log(` └ 送信(Write)準備完了！`);
          }
        }

        if (targetWriteChar) {
          document.getElementById('status').innerText = '準備完了！ボタンで送信してください';
          document.getElementById('btnCmd1').disabled = false;
          document.getElementById('btnCmd2').disabled = false;
          document.getElementById('btnCmd3').disabled = false;
        } else {
          log('エラー: 送信可能な特性が見つかりません');
        }

      } catch (error) {
        log(`エラー: ${error.message}`);
        document.getElementById('status').innerText = 'エラー';
      }
    });

    async function sendCommand(cmdName, data) {
      if (!targetWriteChar) return;
      try {
        log(`送信: ${cmdName}`);
        if (targetWriteChar.properties.writeWithoutResponse) {
          await targetWriteChar.writeValueWithoutResponse(data);
        } else {
          await targetWriteChar.writeValue(data);
        }
      } catch (error) {
        log(`送信失敗: ${error.message}`);
      }
    }

    document.getElementById('btnCmd1').addEventListener('click', () => sendCommand('標準(01)', cmds.cmd1));
    document.getElementById('btnCmd2').addEventListener('click', () => sendCommand('全体(FF)', cmds.cmd2));
    document.getElementById('btnCmd3').addEventListener('click', () => sendCommand('ゼロ(00)', cmds.cmd3));

    function handleData(event) {
      const bytes = new Uint8Array(event.target.value.buffer);
      const hexString = Array.from(bytes).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
      document.getElementById('hexValue').innerText = hexString;
      log(`★受信: ${hexString}`);
    }
  </script>
</body>
</html>
