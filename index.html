    body {

    /* Rotary Knob Styling */
    .knob-container {
      position: relative;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      cursor: ns-resize;
    }
    .knob-body {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #4a4d5a, #1a1b22 80%);
      border: 2px solid #5a5d6e;
      box-shadow: 0 4px 8px rgba(0,0,0,0.6), inset 0 2px 3px rgba(255,255,255,0.2);
      position: relative;
      transition: transform 0.05s ease-out;
    }
    .knob-pointer {
      position: absolute;
      top: 4px;
      left: 50%;
      width: 3px;
      height: 14px;
      background: #f87171;
      border-radius: 2px;
      transform: translateX(-50%);
      box-shadow: 0 0 4px rgba(248, 113, 113, 0.8);
    }

    .texture-delay { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); }
    .texture-amp { background: linear-gradient(180deg, #2d2013 0%, #17100a 100%); }
    .texture-cab { background: radial-gradient(circle, #262626 20%, #171717 80%); }

    /* LED Glow Effects */
    .led {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #374151;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
      transition: all 0.2s ease;
    }
    .led.active-red {
      background-color: #ef4444;
      box-shadow: 0 0 10px #ef4444, inset 0 1px 2px rgba(255,255,255,0.5);
    }
    .led.active-green {
      background-color: #10b981;
      box-shadow: 0 0 10px #10b981, inset 0 1px 2px rgba(255,255,255,0.5);
    }

    /* Screw Heads */
    .screw {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4b5563;
      box-shadow: inset 1px 1px 2px rgba(0,0,0,0.8), 0.5px 0.5px 1px rgba(255,255,255,0.2);
      position: relative;
    }
    .screw::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 1px;
      width: 6px;
      height: 1px;
      background: #1f2937;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-track { background: #111827; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
  </style>
</head>
